<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Prix / Mcap</title>
<style>
  :root {
    --bg: #0b0d10;
    --card: #14171c;
    --border: #22262e;
    --text: #e7e9ec;
    --muted: #8b93a1;
    --green: #3ddc84;
    --orange: #ffa53d;
    --red: #ff5c5c;
    --accent: #6d8bff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  @media (max-width: 480px) {
    body { padding: 14px; }
  }
  h1 {
    font-size: 18px;
    font-weight: 600;
    margin: 0 0 4px 0;
  }
  .sub {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 20px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
    max-width: 800px;
  }
  @media (max-width: 480px) {
    .grid { grid-template-columns: 1fr; gap: 12px; }
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 4px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    position: relative;
    overflow: hidden;
    transition: border-color 0.3s ease;
  }
  @media (max-width: 480px) {
    .card { padding: 14px; border-radius: 12px; }
    .price-big { font-size: 22px; }
    .row { font-size: 13px; }
    .label, .value { font-size: 13px; }
  }
  .card.status-red { border-left-color: var(--red); }
  .card.status-orange { border-left-color: var(--orange); }
  .card.status-green { border-left-color: var(--green); }
  .mcap-big { color: inherit; }
  .card.status-red .mcap-big { color: var(--red); }
  .card.status-orange .mcap-big { color: var(--orange); }
  .card.status-green .mcap-big { color: var(--green); }
  .card .name {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 2px;
  }
  .card .pair {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 16px;
  }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 8px 0;
    border-top: 1px solid var(--border);
  }
  .row:first-of-type { border-top: none; }
  .label {
    font-size: 13px;
    color: var(--muted);
  }
  .value {
    font-size: 15px;
    font-weight: 600;
  }
  .price-big {
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 2px;
  }
  .change {
    font-size: 13px;
    font-weight: 600;
  }
  .change.up { color: var(--green); }
  .change.down { color: var(--red); }
  .footer {
    margin-top: 20px;
    font-size: 12px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  .error {
    color: var(--red);
    font-size: 13px;
  }
  a { color: var(--accent); text-decoration: none; }
  .skeleton {
    color: var(--muted);
    font-size: 13px;
  }
  .summary .row:first-of-type { border-top: none; }
  .summary-title {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 12px;
  }
  .note {
    font-size: 12px;
    color: var(--muted);
    margin-top: 10px;
    line-height: 1.5;
  }
  .bottom-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
    max-width: 800px;
    margin-top: 16px;
  }
  @media (max-width: 480px) {
    .bottom-row { grid-template-columns: 1fr; gap: 12px; }
  }
  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    max-width: 800px;
  }
  .settings-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 13px;
    padding: 8px 12px;
    border-radius: 10px;
    cursor: pointer;
    white-space: nowrap;
  }
  .settings-btn:hover { border-color: var(--accent); }
  .settings-panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    max-width: 800px;
    margin-bottom: 16px;
  }
  .settings-title {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 12px;
  }
  .pair-row {
    display: grid;
    grid-template-columns: 1fr 1.6fr 0.9fr 0.7fr auto;
    gap: 8px;
    margin-bottom: 8px;
    align-items: center;
  }
  @media (max-width: 480px) {
    .pair-row { grid-template-columns: 1fr 1fr; }
  }
  .pair-row input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 7px 8px;
    font-size: 13px;
  }
  .pair-row input:focus { outline: none; border-color: var(--accent); }
  .pair-row .field-label {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 3px;
    display: block;
  }
  .remove-row-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--red);
    border-radius: 8px;
    width: 32px;
    height: 32px;
    cursor: pointer;
    font-size: 14px;
  }
  .settings-actions {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  .btn {
    padding: 9px 14px;
    border-radius: 10px;
    font-size: 13px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
  }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #0b0d10; font-weight: 600; }
  .btn-ghost:hover { border-color: var(--accent); }
  .setting-field {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    max-width: 220px;
  }
  .setting-field label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
  .setting-field input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 7px 8px;
    font-size: 13px;
  }
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
  }
  .modal-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    max-width: 420px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
  }
  .modal-title {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 14px;
  }
  .modal-box .row:first-of-type { border-top: none; }
  .sort-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    max-width: 800px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .sort-bar label {
    font-size: 13px;
    color: var(--muted);
  }
  .sort-bar select {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  .sort-bar select:focus { outline: none; border-color: var(--accent); }
</style>
</head>
<body>

<div class="header-row">
  <div>
    <h1>Dashboard Prix / Market Cap</h1>
    <div class="sub">Mise à jour automatique toutes les 15 secondes — source : Dexscreener</div>
  </div>
  <button class="settings-btn" id="settingsBtn">⚙️ Paramètres</button>
</div>

<div class="settings-panel" id="settingsPanel" style="display:none">
  <div class="settings-title">Positions</div>
  <div id="pairsFormRows"></div>
  <button class="btn btn-ghost" id="addRowBtn" type="button">+ Ajouter une position</button>

  <div class="setting-field">
    <label for="alertThresholdInput">Seuil d'alerte au démarrage (%)</label>
    <input type="number" step="any" id="alertThresholdInput">
  </div>

  <div class="settings-actions">
    <button class="btn btn-primary" id="saveConfigBtn" type="button">Enregistrer</button>
    <button class="btn btn-ghost" id="cancelConfigBtn" type="button">Annuler</button>
    <button class="btn btn-ghost" id="resetConfigBtn" type="button">Réinitialiser</button>
  </div>
</div>

<div class="modal-overlay" id="alertOverlay">
  <div class="modal-box">
    <div class="modal-title">🚀 Mouvement(s) important(s) détecté(s)</div>
    <div id="alertList"></div>
    <div class="settings-actions">
      <button class="btn btn-primary" id="alertOkBtn" type="button">OK</button>
    </div>
  </div>
</div>

<div class="sort-bar">
  <label for="sortSelect">Classement (décroissant) :</label>
  <select id="sortSelect">
    <option value="none">Aucun (ordre par défaut)</option>
    <option value="value">Valeur position</option>
    <option value="pnl">PnL</option>
    <option value="mcap">Market Cap</option>
  </select>
</div>

<div class="grid" id="grid"></div>

<div class="bottom-row">
  <div class="card summary" id="summary">
    <div class="skeleton">Calcul du portefeuille...</div>
  </div>
</div>

<div class="footer">
  <div class="dot"></div>
  <span id="lastUpdate">Chargement...</span>
</div>

<script>
/* =========================================================
   VALEURS PAR DÉFAUT — utilisées uniquement si rien n'est
   encore enregistré dans le navigateur (localStorage).
   Une fois que vous sauvegardez via le panneau "Paramètres",
   ces valeurs par défaut ne sont plus utilisées (sauf si vous
   cliquez sur "Réinitialiser").
   ========================================================= */
const DEFAULT_PAIRS = [
  { chain: "robinhood", address: "0x65137aF8C54199628f74db33573b3CdDE7409BE9", bag: 2000000, invested: 10 },
];
const DEFAULT_ALERT_THRESHOLD = 30;
const STORAGE_KEY = "dexDashboardConfig_v1";
const SNAPSHOT_KEY = "dexDashboardSnapshots_v1";

function loadConfig() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.pairs) && parsed.pairs.length > 0) {
        return {
          pairs: parsed.pairs,
          alertThreshold: typeof parsed.alertThreshold === "number" ? parsed.alertThreshold : DEFAULT_ALERT_THRESHOLD
        };
      }
    }
  } catch (e) {
    console.warn("Config locale illisible, retour aux valeurs par défaut.", e);
  }
  return {
    pairs: JSON.parse(JSON.stringify(DEFAULT_PAIRS)),
    alertThreshold: DEFAULT_ALERT_THRESHOLD
  };
}

function loadSnapshots() {
  try {
    const raw = localStorage.getItem(SNAPSHOT_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    return {};
  }
}

function saveSnapshots(snap) {
  localStorage.setItem(SNAPSHOT_KEY, JSON.stringify(snap));
}

function saveConfig(cfg) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg));
}

function deriveLowHigh(list) {
  list.forEach(p => {
    p.low = (p.invested / p.bag) * 1e9;
    p.high = p.low;
  });
}

let { pairs, alertThreshold: ALERT_THRESHOLD } = loadConfig();
deriveLowHigh(pairs);
let snapshots = loadSnapshots();
let startupCheckDone = false;

function getStatus(mcap, low, high) {
  if (mcap === null || mcap === undefined || isNaN(mcap)) return "";
  if (mcap < low) return "status-red";
  if (mcap < high) return "status-orange";
  return "status-green";
}

const grid = document.getElementById("grid");
const bagValues = {};
const metrics = {};
const SORT_STORAGE_KEY = "dexDashboardSort_v1";
let sortBy = localStorage.getItem(SORT_STORAGE_KEY) || "none";

function initGrid() {
  grid.innerHTML = "";
  for (const key in bagValues) delete bagValues[key];
  for (const key in metrics) delete metrics[key];
  pairs.forEach((p, i) => {
    const card = document.createElement("div");
    card.className = "card";
    card.id = "card-" + i;
    card.innerHTML = `<div class="skeleton">Chargement des données...</div>`;
    grid.appendChild(card);
  });
}

initGrid();

/* =========================================================
   CLASSEMENT (TRI)
   ========================================================= */
const sortSelect = document.getElementById("sortSelect");
sortSelect.value = sortBy;
sortSelect.addEventListener("change", (e) => {
  sortBy = e.target.value;
  localStorage.setItem(SORT_STORAGE_KEY, sortBy);
  applySort();
});

function applySort() {
  if (sortBy === "none") return;
  const indices = pairs.map((_, i) => i);
  indices.sort((a, b) => {
    const ma = metrics[a] ? metrics[a][sortBy] : null;
    const mb = metrics[b] ? metrics[b][sortBy] : null;
    const aInvalid = ma === null || ma === undefined || isNaN(ma);
    const bInvalid = mb === null || mb === undefined || isNaN(mb);
    if (aInvalid && bInvalid) return 0;
    if (aInvalid) return 1;
    if (bInvalid) return -1;
    return mb - ma; // décroissant
  });
  indices.forEach(i => {
    const card = document.getElementById("card-" + i);
    if (card) grid.appendChild(card);
  });
}

/* =========================================================
   PANNEAU DE PARAMÈTRES
   ========================================================= */
const settingsBtn = document.getElementById("settingsBtn");
const settingsPanel = document.getElementById("settingsPanel");
const pairsFormRows = document.getElementById("pairsFormRows");
const alertThresholdInput = document.getElementById("alertThresholdInput");

function makeRow(p) {
  const row = document.createElement("div");
  row.className = "pair-row";
  row.innerHTML = `
    <div>
      <span class="field-label">Chain</span>
      <input type="text" class="f-chain" value="${p.chain ?? ""}" placeholder="ex: ethereum">
    </div>
    <div>
      <span class="field-label">Adresse de la pool</span>
      <input type="text" class="f-address" value="${p.address ?? ""}" placeholder="0x...">
    </div>
    <div>
      <span class="field-label">Bag (tokens)</span>
      <input type="number" step="any" class="f-bag" value="${p.bag ?? ""}">
    </div>
    <div>
      <span class="field-label">Investi ($)</span>
      <input type="number" step="any" class="f-invested" value="${p.invested ?? ""}">
    </div>
    <button type="button" class="remove-row-btn" title="Supprimer">✕</button>
  `;
  row.querySelector(".remove-row-btn").addEventListener("click", () => row.remove());
  return row;
}

function renderSettingsForm() {
  pairsFormRows.innerHTML = "";
  pairs.forEach(p => pairsFormRows.appendChild(makeRow(p)));
  alertThresholdInput.value = ALERT_THRESHOLD;
}

document.getElementById("addRowBtn").addEventListener("click", () => {
  pairsFormRows.appendChild(makeRow({ chain: "", address: "", bag: "", invested: "" }));
});

settingsBtn.addEventListener("click", () => {
  const opening = settingsPanel.style.display === "none";
  if (opening) renderSettingsForm();
  settingsPanel.style.display = opening ? "block" : "none";
});

document.getElementById("cancelConfigBtn").addEventListener("click", () => {
  settingsPanel.style.display = "none";
});

document.getElementById("resetConfigBtn").addEventListener("click", () => {
  if (!confirm("Réinitialiser aux valeurs par défaut ? Vos modifications enregistrées seront effacées.")) return;
  localStorage.removeItem(STORAGE_KEY);
  const cfg = loadConfig();
  pairs = cfg.pairs;
  ALERT_THRESHOLD = cfg.alertThreshold;
  deriveLowHigh(pairs);
  initGrid();
  settingsPanel.style.display = "none";
  refreshAll();
});

document.getElementById("saveConfigBtn").addEventListener("click", () => {
  const rows = pairsFormRows.querySelectorAll(".pair-row");
  const newPairs = [];
  rows.forEach(row => {
    const chain = row.querySelector(".f-chain").value.trim();
    const address = row.querySelector(".f-address").value.trim();
    const bag = parseFloat(row.querySelector(".f-bag").value);
    const invested = parseFloat(row.querySelector(".f-invested").value);
    if (chain && address && bag > 0 && invested >= 0) {
      newPairs.push({ chain, address, bag, invested });
    }
  });
  if (newPairs.length === 0) {
    alert("Ajoutez au moins une position valide (chain, adresse, bag > 0, investi rempli).");
    return;
  }
  const newThreshold = parseFloat(alertThresholdInput.value);
  ALERT_THRESHOLD = isNaN(newThreshold) || newThreshold <= 0 ? DEFAULT_ALERT_THRESHOLD : newThreshold;
  pairs = newPairs;
  deriveLowHigh(pairs);
  saveConfig({ pairs, alertThreshold: ALERT_THRESHOLD });
  initGrid();
  settingsPanel.style.display = "none";
  refreshAll();
});

function fmtUsd(num) {
  if (num === null || num === undefined || isNaN(num)) return "—";
  const n = Number(num);
  if (n >= 1) {
    return "$" + n.toLocaleString("en-US", { maximumFractionDigits: 2 });
  }
  // petits prix : afficher plus de décimales significatives
  return "$" + n.toPrecision(4);
}

function fmtMcap(num) {
  if (num === null || num === undefined || isNaN(num)) return "—";
  const n = Number(num);
  if (n >= 1e9) return "$" + (n / 1e9).toFixed(2) + "B";
  if (n >= 1e6) return "$" + (n / 1e6).toFixed(2) + "M";
  if (n >= 1e3) return "$" + (n / 1e3).toFixed(1) + "K";
  return "$" + n.toFixed(0);
}

async function fetchPair(p, i) {
  const card = document.getElementById("card-" + i);
  try {
    const res = await fetch(`https://api.dexscreener.com/latest/dex/pairs/${p.chain}/${p.address}`);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const pair = data.pair || (data.pairs && data.pairs[0]);
    if (!pair) throw new Error("Paire introuvable");

    const priceUsd = pair.priceUsd ? parseFloat(pair.priceUsd) : null;
    const mcap = pair.marketCap ?? pair.fdv ?? null;
    const change24h = pair.priceChange && pair.priceChange.h24 !== undefined ? pair.priceChange.h24 : null;
    const baseSymbol = pair.baseToken ? pair.baseToken.symbol : "?";
    const quoteSymbol = pair.quoteToken ? pair.quoteToken.symbol : "?";
    const dexUrl = pair.url || `https://dexscreener.com/${p.chain}/${p.address}`;

    const changeClass = change24h === null ? "" : (change24h >= 0 ? "up" : "down");
    const changeSign = change24h === null ? "" : (change24h >= 0 ? "+" : "");
    const status = getStatus(mcap, p.low, p.high);

    const bagValue = priceUsd !== null ? p.bag * priceUsd : null;
    bagValues[i] = bagValue;
    const pnl = bagValue !== null ? bagValue - p.invested : null;
    const pnlPct = bagValue !== null && p.invested ? (pnl / p.invested) * 100 : null;
    const pnlClass = pnl === null ? "" : (pnl >= 0 ? "up" : "down");
    const pnlSign = pnl === null ? "" : (pnl >= 0 ? "+" : "");

    metrics[i] = { value: bagValue, pnl: pnl, mcap: mcap, symbol: baseSymbol };

    card.className = "card" + (status ? " " + status : "");
    card.innerHTML = `
      <div class="name">${baseSymbol}</div>
      <div class="pair"><a href="${dexUrl}" target="_blank">${baseSymbol} / ${quoteSymbol}</a></div>
      <div class="price-big mcap-big">${fmtMcap(mcap)}</div>
      ${change24h !== null ? `<div class="change ${changeClass}">${changeSign}${change24h.toFixed(2)}% (24h)</div>` : ""}
      <div class="row">
        <span class="label">Prix</span>
        <span class="value">${fmtUsd(priceUsd)}</span>
      </div>
      <div class="row">
        <span class="label">Liquidité</span>
        <span class="value">${pair.liquidity && pair.liquidity.usd ? fmtMcap(pair.liquidity.usd) : "—"}</span>
      </div>
      <div class="row">
        <span class="label">Mon bag</span>
        <span class="value">${p.bag.toLocaleString("fr-FR")}</span>
      </div>
      <div class="row">
        <span class="label">Valeur position</span>
        <span class="value">${fmtMcap(bagValue)}</span>
      </div>
      <div class="row">
        <span class="label">PnL (investi ${fmtMcap(p.invested)})</span>
        <span class="value change ${pnlClass}">${pnlSign}${fmtMcap(Math.abs(pnl))} (${pnlSign}${pnlPct !== null ? pnlPct.toFixed(1) : "—"}%)</span>
      </div>
    `;
  } catch (e) {
    metrics[i] = null;
    card.innerHTML = `<div class="name">Erreur</div><div class="error">${e.message}</div>`;
  }
}

async function refreshAll() {
  await Promise.all(pairs.map((p, i) => fetchPair(p, i)));
  applySort();
  renderSummary();
  checkStartupAlerts();
  document.getElementById("lastUpdate").textContent =
    "Dernière mise à jour : " + new Date().toLocaleTimeString("fr-FR");
}

/* =========================================================
   ALERTE AU DÉMARRAGE (mouvement de valeur position depuis
   la dernière consultation). Ne s'exécute qu'une seule fois
   par chargement de page, quel que soit le nombre de positions
   qui déclenchent l'alerte (une seule popup regroupée).
   ========================================================= */
function checkStartupAlerts() {
  if (startupCheckDone) return;
  startupCheckDone = true;

  const triggered = [];
  pairs.forEach((p, i) => {
    const m = metrics[i];
    if (!m || m.value === null || m.value === undefined || isNaN(m.value)) return;
    const key = p.chain + ":" + p.address;
    const prev = snapshots[key];
    if (typeof prev === "number" && prev > 0) {
      const changePct = ((m.value - prev) / prev) * 100;
      if (Math.abs(changePct) >= ALERT_THRESHOLD) {
        triggered.push({
          name: m.symbol || (p.chain + " " + p.address.slice(0, 6)),
          changePct,
          prevValue: prev,
          currentValue: m.value
        });
      }
    }
    snapshots[key] = m.value;
  });
  saveSnapshots(snapshots);

  if (triggered.length > 0) showAlertModal(triggered);
}

function showAlertModal(triggered) {
  triggered.sort((a, b) => b.changePct - a.changePct);
  const list = document.getElementById("alertList");
  list.innerHTML = triggered.map(t => {
    const cls = t.changePct >= 0 ? "up" : "down";
    const sign = t.changePct >= 0 ? "+" : "";
    return `
      <div class="row">
        <span class="label">${t.name}</span>
        <span class="value change ${cls}">${sign}${t.changePct.toFixed(1)}% (${fmtMcap(t.prevValue)} → ${fmtMcap(t.currentValue)})</span>
      </div>
    `;
  }).join("");
  document.getElementById("alertOverlay").style.display = "flex";
}

document.getElementById("alertOkBtn").addEventListener("click", () => {
  document.getElementById("alertOverlay").style.display = "none";
});

function renderSummary() {
  const summary = document.getElementById("summary");
  const values = Object.values(bagValues);
  if (values.some(v => v === null || v === undefined) || values.length < pairs.length) {
    summary.innerHTML = `<div class="skeleton">Calcul du portefeuille...</div>`;
    return;
  }
  const totalValue = values.reduce((a, b) => a + b, 0);
  const TOTAL_INVESTED = pairs.reduce((sum, p) => sum + p.invested, 0);
  const totalPnl = totalValue - TOTAL_INVESTED;
  const totalPnlPct = (totalPnl / TOTAL_INVESTED) * 100;
  const pnlClass = totalPnl >= 0 ? "up" : "down";
  const pnlSign = totalPnl >= 0 ? "+" : "";

  summary.innerHTML = `
    <div class="summary-title">Portefeuille total</div>
    <div class="row">
      <span class="label">Investi initial</span>
      <span class="value">${fmtMcap(TOTAL_INVESTED)}</span>
    </div>
    <div class="row">
      <span class="label">Valeur actuelle</span>
      <span class="value">${fmtMcap(totalValue)}</span>
    </div>
    <div class="row">
      <span class="label">PnL total</span>
      <span class="value change ${pnlClass}">${pnlSign}${fmtMcap(Math.abs(totalPnl))} (${pnlSign}${totalPnlPct.toFixed(1)}%)</span>
    </div>
  `;
}

refreshAll();
setInterval(refreshAll, 15000);
</script>

</body>
</html>
