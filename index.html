<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Prix / Mcap</title>
<style>
  :root {
    --bg: #0b0d10;
    --card: #14171c;
    --border: #22262e;
    --text: #e7e9ec;
    --muted: #8b93a1;
    --green: #3ddc84;
    --orange: #ffa53d;
    --red: #ff5c5c;
    --accent: #6d8bff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  @media (max-width: 480px) {
    body { padding: 14px; }
  }
  h1 {
    font-size: 18px;
    font-weight: 600;
    margin: 0 0 4px 0;
  }
  .sub {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 20px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
    max-width: 800px;
  }
  @media (max-width: 480px) {
    .grid { grid-template-columns: 1fr; gap: 12px; }
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 4px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    position: relative;
    overflow: hidden;
    transition: border-color 0.3s ease;
  }
  @media (max-width: 480px) {
    .card { padding: 14px; border-radius: 12px; }
    .price-big { font-size: 22px; }
    .row { font-size: 13px; }
    .label, .value { font-size: 13px; }
  }
  .card.status-red { border-left-color: var(--red); }
  .card.status-orange { border-left-color: var(--orange); }
  .card.status-green { border-left-color: var(--green); }
  .card.status-accent { border-left-color: var(--accent); }
  .mcap-big { color: inherit; }
  .card.status-red .mcap-big { color: var(--red); }
  .card.status-orange .mcap-big { color: var(--orange); }
  .card.status-green .mcap-big { color: var(--green); }
  .card .name {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 2px;
  }
  .card .pair {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 16px;
  }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    padding: 8px 0;
    border-top: 1px solid var(--border);
  }
  .row:first-of-type { border-top: none; }
  .label {
    font-size: 13px;
    color: var(--muted);
  }
  .value {
    font-size: 15px;
    font-weight: 600;
    text-align: right;
  }
  .value small {
    display: block;
    font-size: 11px;
    font-weight: 400;
    color: var(--muted);
  }
  .price-big {
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 2px;
  }
  .change {
    font-size: 13px;
    font-weight: 600;
  }
  .change.up { color: var(--green); }
  .change.down { color: var(--red); }
  .footer {
    margin-top: 20px;
    font-size: 12px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  .error {
    color: var(--red);
    font-size: 13px;
  }
  a { color: var(--accent); text-decoration: none; }
  .skeleton {
    color: var(--muted);
    font-size: 13px;
  }
  .summary .row:first-of-type { border-top: none; }
  .summary-title {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 12px;
  }
  .note {
    font-size: 12px;
    color: var(--muted);
    margin-top: 10px;
    line-height: 1.5;
  }
  .bottom-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
    max-width: 800px;
    margin-top: 16px;
  }
  @media (max-width: 480px) {
    .bottom-row { grid-template-columns: 1fr; gap: 12px; }
  }
  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    max-width: 800px;
  }
  .settings-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 13px;
    padding: 8px 12px;
    border-radius: 10px;
    cursor: pointer;
    white-space: nowrap;
  }
  .settings-btn:hover { border-color: var(--accent); }
  .settings-panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    max-width: 800px;
    margin-bottom: 16px;
  }
  .settings-title {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 12px;
  }
  .settings-section {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .pair-row {
    display: grid;
    grid-template-columns: 1fr 1.6fr 0.9fr 0.7fr auto;
    gap: 8px;
    margin-bottom: 8px;
    align-items: center;
  }
  @media (max-width: 480px) {
    .pair-row { grid-template-columns: 1fr 1fr; }
  }
  .pair-row input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 7px 8px;
    font-size: 13px;
  }
  .pair-row input:focus { outline: none; border-color: var(--accent); }
  .pair-row .field-label {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 3px;
    display: block;
  }
  .account-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 8px;
  }
  @media (max-width: 480px) {
    .account-row { grid-template-columns: 1fr; }
  }
  .account-row label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 3px; }
  .account-row input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 7px 8px;
    font-size: 13px;
  }
  .account-row input:focus { outline: none; border-color: var(--accent); }
  .remove-row-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--red);
    border-radius: 8px;
    width: 32px;
    height: 32px;
    cursor: pointer;
    font-size: 14px;
  }
  .settings-actions {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  .btn {
    padding: 9px 14px;
    border-radius: 10px;
    font-size: 13px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
  }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #0b0d10; font-weight: 600; }
  .btn-ghost:hover { border-color: var(--accent); }
  .setting-field {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    max-width: 220px;
  }
  .setting-field label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
  .setting-field input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 7px 8px;
    font-size: 13px;
  }
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
  }
  .modal-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    max-width: 420px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
  }
  .modal-title {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 14px;
  }
  .modal-box .row:first-of-type { border-top: none; }
  .sort-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    max-width: 800px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .sort-bar label {
    font-size: 13px;
    color: var(--muted);
  }
  .sort-bar select {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  .sort-bar select:focus { outline: none; border-color: var(--accent); }

  /* ---------- Onglets ---------- */
  .tabs {
    display: flex;
    gap: 4px;
    max-width: 800px;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .tab-btn {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
    padding: 10px 14px;
    cursor: pointer;
    margin-bottom: -1px;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--text); border-bottom-color: var(--accent); }
  .view { display: none; }
  .view.active { display: block; }
  .account-wrap { max-width: 800px; }
  .account-total {
    font-size: 30px;
    font-weight: 700;
    color: var(--accent);
    margin: 4px 0 2px 0;
  }
  .value small.chg.up, .chg.up { color: var(--green); }
  .value small.chg.down, .chg.down { color: var(--red); }
  .account-chg { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
  .loan-row {
    display: grid;
    grid-template-columns: 1.4fr 1fr 1fr auto;
    gap: 8px;
    margin-bottom: 8px;
    align-items: end;
  }
  @media (max-width: 480px) {
    .loan-row { grid-template-columns: 1fr 1fr; }
  }
  .loan-row label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 3px; }
  .loan-row input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 7px 8px;
    font-size: 13px;
  }
  .loan-row input:focus { outline: none; border-color: var(--accent); }
  .loan-total { border-top: 2px solid var(--border) !important; margin-top: 4px; }
  .account-usd {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 14px;
  }
</style>
</head>
<body>

<div class="header-row">
  <div>
    <h1>Dashboard Prix / Market Cap</h1>
    <div class="sub">Mise à jour automatique toutes les 15 secondes — source : Dexscreener</div>
  </div>
  <button class="settings-btn" id="settingsBtn">⚙️ Paramètres</button>
</div>

<div class="settings-panel" id="settingsPanel" style="display:none">
  <div class="settings-title">Positions</div>
  <div id="pairsFormRows"></div>
  <button class="btn btn-ghost" id="addRowBtn" type="button">+ Ajouter une position</button>

  <div class="settings-section">
    <div class="settings-title">Compte total</div>
    <div class="account-row">
      <div>
        <label for="accAvaxInput">Quantité d'AVAX</label>
        <input type="number" step="any" min="0" id="accAvaxInput" placeholder="0">
      </div>
      <div>
        <label for="accPharInput">Quantité de PHAR</label>
        <input type="number" step="any" min="0" id="accPharInput" placeholder="0">
      </div>
      <div>
        <label for="accSavaxInput">Quantité de sAVAX</label>
        <input type="number" step="any" min="0" id="accSavaxInput" placeholder="0">
      </div>
      <div>
        <label for="accLinkInput">Quantité de LINK (arbitrage)</label>
        <input type="number" step="any" min="0" id="accLinkInput" placeholder="0">
      </div>
    </div>
  </div>

  <div class="settings-section">
    <div class="settings-title">Emprunts</div>
    <div id="loansFormRows"></div>
    <button class="btn btn-ghost" id="addLoanBtn" type="button">+ Ajouter un emprunt</button>
  </div>

  <div class="setting-field">
    <label for="alertThresholdInput">Seuil d'alerte au démarrage (%)</label>
    <input type="number" step="any" id="alertThresholdInput">
  </div>

  <div class="settings-actions">
    <button class="btn btn-primary" id="saveConfigBtn" type="button">Enregistrer</button>
    <button class="btn btn-ghost" id="cancelConfigBtn" type="button">Annuler</button>
    <button class="btn btn-ghost" id="resetConfigBtn" type="button">Réinitialiser</button>
  </div>
</div>

<div class="modal-overlay" id="alertOverlay">
  <div class="modal-box">
    <div class="modal-title">🚀 Mouvement(s) important(s) détecté(s)</div>
    <div id="alertList"></div>
    <div class="settings-actions">
      <button class="btn btn-primary" id="alertOkBtn" type="button">OK</button>
    </div>
  </div>
</div>

<div class="tabs">
  <button class="tab-btn" data-tab="positions" type="button">Positions</button>
  <button class="tab-btn" data-tab="account" type="button">Compte total</button>
  <button class="tab-btn" data-tab="loan" type="button">Emprunt</button>
</div>

<!-- ================= ONGLET POSITIONS ================= -->
<div class="view" id="view-positions">
  <div class="sort-bar">
    <label for="sortSelect">Classement (décroissant) :</label>
    <select id="sortSelect">
      <option value="none">Aucun (ordre par défaut)</option>
      <option value="value">Valeur position</option>
      <option value="pnl">PnL</option>
      <option value="mcap">Market Cap</option>
    </select>
  </div>

  <div class="grid" id="grid"></div>

  <div class="bottom-row">
    <div class="card summary" id="summary">
      <div class="skeleton">Calcul du portefeuille...</div>
    </div>
  </div>
</div>

<!-- ================= ONGLET COMPTE TOTAL ================= -->
<div class="view" id="view-account">
  <div class="account-wrap">
    <div class="card status-accent" id="accountCard">
      <div class="skeleton">Chargement du compte...</div>
    </div>
  </div>
</div>

<!-- ================= ONGLET EMPRUNT ================= -->
<div class="view" id="view-loan">
  <div class="account-wrap">
    <div class="card status-accent" id="loanCard">
      <div class="skeleton">Chargement...</div>
    </div>
  </div>
</div>

<div class="footer">
  <div class="dot"></div>
  <span id="lastUpdate">Chargement...</span>
</div>

<script>
/* =========================================================
   VALEURS PAR DÉFAUT — utilisées uniquement si rien n'est
   encore enregistré dans le navigateur (localStorage).
   Une fois que vous sauvegardez via le panneau "Paramètres",
   ces valeurs par défaut ne sont plus utilisées (sauf si vous
   cliquez sur "Réinitialiser").
   ========================================================= */
const DEFAULT_PAIRS = [
  { chain: "blabla", address: "0x65137aF8C54199627f74db33573b3CdDE7409BE9", bag: 2000000, invested: 10 },
];
const DEFAULT_ALERT_THRESHOLD = 30;
const DEFAULT_ACCOUNT = { avax: 0, phar: 0, savax: 0, link: 0 };
const DEFAULT_LOANS = []; // [{ label, amount (AVAX), price ($ par AVAX au moment de l'emprunt) }]
const STORAGE_KEY = "dexDashboardConfig_v1";
const SNAPSHOT_KEY = "dexDashboardSnapshots_v1";
const TAB_STORAGE_KEY = "dexDashboardTab_v1";

/* =========================================================
   COMPTE TOTAL — adresses des tokens sur Avalanche C-Chain
   (modifiables ici si un token migre un jour)
   ========================================================= */
const ACCOUNT_CHAIN = "avalanche";
const TOKENS = {
  WAVAX: "0xB31f66AA3C1e785363F0875A1B74E27b85FD66c7",
  PHAR:  "0x13A466998Ce03Db73aBc2d4DF3bBD845Ed1f28E7", // PHAR (Pharaoh V3)
  SAVAX: "0x2b2C81e08f1Af8835a78Bb2A90AE924ACE0eA4bE", // sAVAX (Benqi)
  USDT_AVAX: "0x9702230A8Ea53601f5cD2dc00fDBc13d4dF4A8c7", // USDt natif Avalanche
};
// LINK : prix pris sur Ethereum (Uniswap, paire LINK/USDT en priorité)
const LINK_CHAIN = "ethereum";
const LINK_TOKENS = {
  LINK: "0x514910771AF9Ca656af840dff83E8264EcF986CA",
  USDT: "0xdAC17F958D2ee523a2206206994597C13D831ec7",
};
const PHAR_TAX_DIVISOR = 2; // PHAR compté à 50 % à cause de la taxe

function sanitizeAccount(a) {
  const out = { ...DEFAULT_ACCOUNT };
  if (a && typeof a === "object") {
    ["avax", "phar", "savax", "link"].forEach(k => {
      const v = parseFloat(a[k]);
      out[k] = isNaN(v) || v < 0 ? 0 : v;
    });
  }
  return out;
}

function sanitizeLoans(list) {
  if (!Array.isArray(list)) return [];
  return list
    .map(l => ({
      label: (l && l.label ? String(l.label) : "").trim(),
      amount: parseFloat(l && l.amount),
      price: parseFloat(l && l.price)
    }))
    .filter(l => l.amount > 0 && l.price > 0);
}

function loadConfig() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.pairs) && parsed.pairs.length > 0) {
        return {
          pairs: parsed.pairs,
          alertThreshold: typeof parsed.alertThreshold === "number" ? parsed.alertThreshold : DEFAULT_ALERT_THRESHOLD,
          account: sanitizeAccount(parsed.account),
          loans: sanitizeLoans(parsed.loans)
        };
      }
    }
  } catch (e) {
    console.warn("Config locale illisible, retour aux valeurs par défaut.", e);
  }
  return {
    pairs: JSON.parse(JSON.stringify(DEFAULT_PAIRS)),
    alertThreshold: DEFAULT_ALERT_THRESHOLD,
    account: { ...DEFAULT_ACCOUNT },
    loans: JSON.parse(JSON.stringify(DEFAULT_LOANS))
  };
}

function loadSnapshots() {
  try {
    const raw = localStorage.getItem(SNAPSHOT_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    return {};
  }
}

function saveSnapshots(snap) {
  localStorage.setItem(SNAPSHOT_KEY, JSON.stringify(snap));
}

function saveConfig(cfg) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg));
}

function deriveLowHigh(list) {
  list.forEach(p => {
    p.low = (p.invested / p.bag) * 1e9;
    p.high = p.low;
  });
}

let { pairs, alertThreshold: ALERT_THRESHOLD, account, loans } = loadConfig();
let lastAvaxUsd = null; // prix AVAX courant, partagé avec l'onglet Emprunt
deriveLowHigh(pairs);
let snapshots = loadSnapshots();
let startupCheckDone = false;

function getStatus(mcap, low, high) {
  if (mcap === null || mcap === undefined || isNaN(mcap)) return "";
  if (mcap < low) return "status-red";
  if (mcap < high) return "status-orange";
  return "status-green";
}

const grid = document.getElementById("grid");
const bagValues = {};
const metrics = {};
const SORT_STORAGE_KEY = "dexDashboardSort_v1";
let sortBy = localStorage.getItem(SORT_STORAGE_KEY) || "none";

function initGrid() {
  grid.innerHTML = "";
  for (const key in bagValues) delete bagValues[key];
  for (const key in metrics) delete metrics[key];
  pairs.forEach((p, i) => {
    const card = document.createElement("div");
    card.className = "card";
    card.id = "card-" + i;
    card.innerHTML = `<div class="skeleton">Chargement des données...</div>`;
    grid.appendChild(card);
  });
}

initGrid();

/* =========================================================
   ONGLETS
   ========================================================= */
const tabButtons = document.querySelectorAll(".tab-btn");
function setTab(tab) {
  if (!["positions", "account", "loan"].includes(tab)) tab = "positions";
  tabButtons.forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  document.getElementById("view-positions").classList.toggle("active", tab === "positions");
  document.getElementById("view-account").classList.toggle("active", tab === "account");
  document.getElementById("view-loan").classList.toggle("active", tab === "loan");
  localStorage.setItem(TAB_STORAGE_KEY, tab);
}
tabButtons.forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));
setTab(localStorage.getItem(TAB_STORAGE_KEY) || "positions");

/* =========================================================
   CLASSEMENT (TRI)
   ========================================================= */
const sortSelect = document.getElementById("sortSelect");
sortSelect.value = sortBy;
sortSelect.addEventListener("change", (e) => {
  sortBy = e.target.value;
  localStorage.setItem(SORT_STORAGE_KEY, sortBy);
  applySort();
});

function applySort() {
  if (sortBy === "none") return;
  const indices = pairs.map((_, i) => i);
  indices.sort((a, b) => {
    const ma = metrics[a] ? metrics[a][sortBy] : null;
    const mb = metrics[b] ? metrics[b][sortBy] : null;
    const aInvalid = ma === null || ma === undefined || isNaN(ma);
    const bInvalid = mb === null || mb === undefined || isNaN(mb);
    if (aInvalid && bInvalid) return 0;
    if (aInvalid) return 1;
    if (bInvalid) return -1;
    return mb - ma; // décroissant
  });
  indices.forEach(i => {
    const card = document.getElementById("card-" + i);
    if (card) grid.appendChild(card);
  });
}

/* =========================================================
   PANNEAU DE PARAMÈTRES
   ========================================================= */
const settingsBtn = document.getElementById("settingsBtn");
const settingsPanel = document.getElementById("settingsPanel");
const pairsFormRows = document.getElementById("pairsFormRows");
const alertThresholdInput = document.getElementById("alertThresholdInput");
const accAvaxInput = document.getElementById("accAvaxInput");
const accPharInput = document.getElementById("accPharInput");
const accSavaxInput = document.getElementById("accSavaxInput");
const accLinkInput = document.getElementById("accLinkInput");

function makeRow(p) {
  const row = document.createElement("div");
  row.className = "pair-row";
  row.innerHTML = `
    <div>
      <span class="field-label">Chain</span>

function fmtUsd(num) {
  if (num === null || num === undefined || isNaN(num)) return "—";
  const n = Number(num);
  if (n >= 1) {
    return "$" + n.toLocaleString("en-US", { maximumFractionDigits: 2 });
  }
  // petits prix : afficher plus de décimales significatives
  return "$" + n.toPrecision(4);
}

function fmtMcap(num) {
  if (num === null || num === undefined || isNaN(num)) return "—";
  const n = Number(num);
  if (n >= 1e9) return "$" + (n / 1e9).toFixed(2) + "B";
  if (n >= 1e6) return "$" + (n / 1e6).toFixed(2) + "M";
  if (n >= 1e3) return "$" + (n / 1e3).toFixed(1) + "K";
  return "$" + n.toFixed(0);
}

function fmtAvax(num, digits = 2) {
  if (num === null || num === undefined || isNaN(num)) return "—";
  return Number(num).toLocaleString("fr-FR", { minimumFractionDigits: digits, maximumFractionDigits: digits }) + " AVAX";
}

function fmtRate(num) {
  if (num === null || num === undefined || isNaN(num)) return "—";
  const n = Number(num);
  return (n >= 1 ? n.toFixed(4) : n.toPrecision(4)) + " AVAX";
}

async function fetchPair(p, i) {
  const card = document.getElementById("card-" + i);
  try {
    const res = await fetch(`https://api.dexscreener.com/latest/dex/pairs/${p.chain}/${p.address}`);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const pair = data.pair || (data.pairs && data.pairs[0]);
    if (!pair) throw new Error("Paire introuvable");

    const priceUsd = pair.priceUsd ? parseFloat(pair.priceUsd) : null;
    const mcap = pair.marketCap ?? pair.fdv ?? null;
    const change24h = pair.priceChange && pair.priceChange.h24 !== undefined ? pair.priceChange.h24 : null;
    const baseSymbol = pair.baseToken ? pair.baseToken.symbol : "?";
    const quoteSymbol = pair.quoteToken ? pair.quoteToken.symbol : "?";
    const dexUrl = pair.url || `https://dexscreener.com/${p.chain}/${p.address}`;

    const changeClass = change24h === null ? "" : (change24h >= 0 ? "up" : "down");
    const changeSign = change24h === null ? "" : (change24h >= 0 ? "+" : "");
    const status = getStatus(mcap, p.low, p.high);

    const bagValue = priceUsd !== null ? p.bag * priceUsd : null;
    bagValues[i] = bagValue;
    const pnl = bagValue !== null ? bagValue - p.invested : null;
    const pnlPct = bagValue !== null && p.invested ? (pnl / p.invested) * 100 : null;
    const pnlClass = pnl === null ? "" : (pnl >= 0 ? "up" : "down");
    const pnlSign = pnl === null ? "" : (pnl >= 0 ? "+" : "");

    metrics[i] = { value: bagValue, pnl: pnl, mcap: mcap, symbol: baseSymbol };

    card.className = "card" + (status ? " " + status : "");
    card.innerHTML = `
      <div class="name">${baseSymbol}</div>
      <div class="pair"><a href="${dexUrl}" target="_blank">${baseSymbol} / ${quoteSymbol}</a></div>
      <div class="price-big mcap-big">${fmtMcap(mcap)}</div>
      ${change24h !== null ? `<div class="change ${changeClass}">${changeSign}${change24h.toFixed(2)}% (24h)</div>` : ""}
      <div class="row">
        <span class="label">Prix</span>
        <span class="value">${fmtUsd(priceUsd)}</span>
      </div>
      <div class="row">
        <span class="label">Liquidité</span>
        <span class="value">${pair.liquidity && pair.liquidity.usd ? fmtMcap(pair.liquidity.usd) : "—"}</span>
      </div>
      <div class="row">
        <span class="label">Mon bag</span>
        <span class="value">${p.bag.toLocaleString("fr-FR")}</span>
      </div>
      <div class="row">
        <span class="label">Valeur position</span>
        <span class="value">${fmtMcap(bagValue)}</span>
      </div>
      <div class="row">
        <span class="label">PnL (investi ${fmtMcap(p.invested)})</span>
        <span class="value change ${pnlClass}">${pnlSign}${fmtMcap(Math.abs(pnl))} (${pnlSign}${pnlPct !== null ? pnlPct.toFixed(1) : "—"}%)</span>
      </div>
    `;
  } catch (e) {
    metrics[i] = null;
    card.innerHTML = `<div class="name">Erreur</div><div class="error">${e.message}</div>`;
  }
}

/* =========================================================
   COMPTE TOTAL (en AVAX, sans PnL)
   - PHAR : quantité × taux PHAR/AVAX ÷ 2 (taxe)
   - sAVAX : quantité × taux sAVAX/AVAX
   - LINK : quantité × (prix LINK/USDT sur Ethereum ÷ prix AVAX/USDT sur Avalanche)
   ========================================================= */
const liq = p => (p.liquidity && p.liquidity.usd) || 0;

// Récupère les paires d'un ou plusieurs tokens sur une chaîne donnée.
// Un appel par token sur l'endpoint "latest" (jusqu'à 30 paires par token,
// donc les pools USDT/USDC sont bien présentes) ; endpoint v1 en secours.
async function fetchOneToken(chain, addr) {
  try {
    const res = await fetch(`https://api.dexscreener.com/latest/dex/tokens/${addr}`);
    if (res.ok) {
      const data = await res.json();
      const list = (Array.isArray(data) ? data : (data.pairs || [])).filter(p => p.chainId === chain);
      if (list.length) return list;
    }
  } catch (e) { /* on tente le secours */ }
  const res = await fetch(`https://api.dexscreener.com/tokens/v1/${chain}/${addr}`);
  if (!res.ok) throw new Error("HTTP " + res.status);
  const data = await res.json();
  return Array.isArray(data) ? data : (data.pairs || []);
}

async function fetchTokenPairs(chain, addrs) {
  const lists = await Promise.all(addrs.map(a => fetchOneToken(chain, a).catch(() => [])));
  return lists.flat();
}

function pairsForToken(allPairs, tokenAddr, chain = ACCOUNT_CHAIN) {
  const addr = tokenAddr.toLowerCase();
  return allPairs
    .filter(p => p.chainId === chain && p.baseToken && p.baseToken.address.toLowerCase() === addr)
    .sort((a, b) => liq(b) - liq(a));
}

const quoteIs = (p, addr) => p.quoteToken && p.quoteToken.address.toLowerCase() === addr.toLowerCase();

// Taux du token en AVAX : paire contre WAVAX en priorité (priceNative),
// sinon prix USD du token ÷ prix USD de l'AVAX.
function rateInAvax(allPairs, tokenAddr, avaxUsd) {
  const list = pairsForToken(allPairs, tokenAddr);
  if (list.length === 0) return { rate: null, usd: null };
  const vsAvax = list.find(p => quoteIs(p, TOKENS.WAVAX) && p.priceNative);
  const best = list[0];
  const usd = best.priceUsd ? parseFloat(best.priceUsd) : null;
  if (vsAvax) return { rate: parseFloat(vsAvax.priceNative), usd };
  if (usd !== null && avaxUsd) return { rate: usd / avaxUsd, usd };
  return { rate: null, usd };
}

// Prix AVAX en USDT : paire WAVAX/USDt sur Avalanche en priorité
function getAvaxUsd(allPairs) {
  const list = pairsForToken(allPairs, TOKENS.WAVAX);
  const vsUsdt = list.find(p => quoteIs(p, TOKENS.USDT_AVAX) && p.priceNative);
  if (vsUsdt) return { usd: parseFloat(vsUsdt.priceNative), src: "AVAX/USDt Avalanche" };
  if (list.length && list[0].priceUsd) return { usd: parseFloat(list[0].priceUsd), src: "paire WAVAX la plus liquide" };
  return { usd: null, src: "" };
}

// Prix LINK en USDT : Uniswap LINK/USDT sur Ethereum en priorité
function getLinkUsd(linkPairs) {
  const list = pairsForToken(linkPairs, LINK_TOKENS.LINK, LINK_CHAIN);
  const uni = list.filter(p => (p.dexId || "").toLowerCase().includes("uniswap"));
  const uniUsdt = uni.find(p => quoteIs(p, LINK_TOKENS.USDT) && p.priceNative);
  if (uniUsdt) return { usd: parseFloat(uniUsdt.priceNative), src: "Uniswap LINK/USDT" };
  const best = uni[0] || list[0];
  if (best && best.priceUsd) return { usd: parseFloat(best.priceUsd), src: (best.dexId || "") + " " + best.baseToken.symbol + "/" + best.quoteToken.symbol };
  return { usd: null, src: "" };
}

/* ---------- Variations 24h ----------
   On prend priceChange.h24 d'une paire cotée en stablecoin (= variation en $),
   puis on convertit en variation "en AVAX" :
   (1 + var token $) / (1 + var AVAX $) - 1                                  */
const STABLES = ["USDC", "USDT", "USDC.E", "USDT.E", "USDT0", "DAI"];

function usdChange24(list) {
  const has = p => p.priceChange && p.priceChange.h24 !== undefined && p.priceChange.h24 !== null;
  const stable = list.find(p => has(p) && p.quoteToken && STABLES.includes((p.quoteToken.symbol || "").toUpperCase()));
  const any = stable || list.find(has);
  return any ? Number(any.priceChange.h24) : null;
}

function rateChange(tokenUsdChg, avaxUsdChg) {
  if (tokenUsdChg === null || avaxUsdChg === null) return null;
  return ((1 + tokenUsdChg / 100) / (1 + avaxUsdChg / 100) - 1) * 100;
}

// Valeur il y a 24h à partir de la valeur actuelle et de la variation en %
function prev24(cur, chg) {
  if (cur === null) return null;
  return chg === null ? cur : cur / (1 + chg / 100);
}

function chgHtml(pct, delta, unit) {
  if (pct === null || isNaN(pct)) return `<small>24h : —</small>`;
  const cls = pct >= 0 ? "up" : "down";
  const sign = pct >= 0 ? "+" : "-";
  const d = delta !== undefined && delta !== null
    ? ` (${sign}${unit === "usd" ? fmtUsd(Math.abs(delta)) : fmtAvax(Math.abs(delta))})` : "";
  return `<small class="chg ${cls}">${sign}${Math.abs(pct).toFixed(2)} %${d} · 24h</small>`;
}

async function fetchAccount() {
  const card = document.getElementById("accountCard");
  try {
    const [allPairs, linkPairs] = await Promise.all([
      fetchTokenPairs(ACCOUNT_CHAIN, [TOKENS.WAVAX, TOKENS.PHAR, TOKENS.SAVAX]),
      account.link > 0 ? fetchTokenPairs(LINK_CHAIN, [LINK_TOKENS.LINK]).catch(() => []) : Promise.resolve([])
    ]);

    const avax = getAvaxUsd(allPairs);
    const avaxUsd = avax.usd;
    lastAvaxUsd = avaxUsd;

    const phar = rateInAvax(allPairs, TOKENS.PHAR, avaxUsd);
    const savax = rateInAvax(allPairs, TOKENS.SAVAX, avaxUsd);
    const link = getLinkUsd(linkPairs);
    const linkRate = link.usd !== null && avaxUsd ? link.usd / avaxUsd : null;

    const avaxPart = account.avax;
    const pharPart = phar.rate !== null ? account.phar * phar.rate / PHAR_TAX_DIVISOR : null;
    const savaxPart = savax.rate !== null ? account.savax * savax.rate : null;
    const linkPart = linkRate !== null ? account.link * linkRate : null;

    const missing = (account.phar > 0 && pharPart === null)
      || (account.savax > 0 && savaxPart === null)
      || (account.link > 0 && linkPart === null);
    const total = avaxPart + (pharPart || 0) + (savaxPart || 0) + (linkPart || 0);
    const totalUsd = avaxUsd ? total * avaxUsd : null;

    // --- Variations 24h ---
    const avaxChg = usdChange24(pairsForToken(allPairs, TOKENS.WAVAX));
    const pharChg = rateChange(usdChange24(pairsForToken(allPairs, TOKENS.PHAR)), avaxChg);
    const savaxChg = rateChange(usdChange24(pairsForToken(allPairs, TOKENS.SAVAX)), avaxChg);
    const linkChg = rateChange(usdChange24(pairsForToken(linkPairs, LINK_TOKENS.LINK, LINK_CHAIN)), avaxChg);

    const pharPrev = prev24(pharPart, pharChg);
    const savaxPrev = prev24(savaxPart, savaxChg);
    const linkPrev = prev24(linkPart, linkChg);
    const avaxUsdPrev = prev24(avaxUsd, avaxChg);

    const totalPrev = avaxPart + (pharPrev || 0) + (savaxPrev || 0) + (linkPrev || 0);
    const totalDelta = total - totalPrev;
    const totalChg = totalPrev > 0 ? (totalDelta / totalPrev) * 100 : null;
    const totalCls = totalDelta >= 0 ? "up" : "down";
    const totalSign = totalDelta >= 0 ? "+" : "-";

    card.innerHTML = `
      <div class="name">Compte total</div>
      <div class="account-total">${fmtAvax(total)}</div>
      ${totalChg !== null
        ? `<div class="account-chg chg ${totalCls}">${totalSign}${fmtAvax(Math.abs(totalDelta))} (${totalSign}${Math.abs(totalChg).toFixed(2)} %) · 24h</div>`
        : ""}
      <div class="account-usd">${totalUsd !== null ? "≈ " + fmtUsd(totalUsd) : ""}${missing ? ' · <span class="error">taux manquant, total incomplet</span>' : ""}</div>
      <div class="row">
        <span class="label">AVAX (${account.avax.toLocaleString("fr-FR")})</span>
        <span class="value">${fmtAvax(avaxPart)}</span>
      </div>
      <div class="row">
        <span class="label">PHAR (${account.phar.toLocaleString("fr-FR")})</span>
        <span class="value">${fmtAvax(pharPart)}<small>taux ${fmtRate(phar.rate)} ÷ ${PHAR_TAX_DIVISOR} (taxe)</small>${account.phar > 0 ? chgHtml(pharChg, pharPart !== null && pharPrev !== null ? pharPart - pharPrev : null, "avax") : ""}</span>
      </div>
      <div class="row">
        <span class="label">sAVAX (${account.savax.toLocaleString("fr-FR")})</span>
        <span class="value">${fmtAvax(savaxPart)}<small>taux ${fmtRate(savax.rate)}</small>${account.savax > 0 ? chgHtml(savaxChg, savaxPart !== null && savaxPrev !== null ? savaxPart - savaxPrev : null, "avax") : ""}</span>
      </div>
      <div class="row">
        <span class="label">LINK (${account.link.toLocaleString("fr-FR")})</span>
        <span class="value">${account.link > 0 ? fmtAvax(linkPart) : fmtAvax(0)}${account.link > 0 ? `<small>taux ${fmtRate(linkRate)} · LINK ${fmtUsd(link.usd)} (${link.src || "—"})</small>${chgHtml(linkChg, linkPart !== null && linkPrev !== null ? linkPart - linkPrev : null, "avax")}` : ""}</span>
      </div>
      <div class="row">
        <span class="label">Prix AVAX</span>
        <span class="value">${fmtUsd(avaxUsd)}${avax.src ? `<small>${avax.src}</small>` : ""}${chgHtml(avaxChg, avaxUsd !== null && avaxUsdPrev !== null ? avaxUsd - avaxUsdPrev : null, "usd")}</span>
      </div>
      ${account.avax === 0 && account.phar === 0 && account.savax === 0 && account.link === 0
        ? `<div class="note">Renseignez vos quantités dans ⚙️ Paramètres → Compte total.</div>` : ""}
    `;
  } catch (e) {
    card.innerHTML = `<div class="name">Compte total</div><div class="error">Erreur : ${e.message}</div>`;
  }
}

/* =========================================================
   EMPRUNT
   Chaque ligne = des AVAX achetés avec de l'argent emprunté,
   au prix indiqué. Gain % = (prix actuel - prix d'achat) / prix d'achat
   ========================================================= */
function escHtml(v) {
  return String(v ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderLoans() {
  const card = document.getElementById("loanCard");
  if (!loans.length) {
    card.innerHTML = `
      <div class="name">Emprunt</div>
      <div class="note">Aucun emprunt. Ajoutez vos lignes dans ⚙️ Paramètres → Emprunts
      (montant en AVAX et prix de l'AVAX au moment de l'emprunt).</div>`;
    return;
  }
  const P = lastAvaxUsd;
  const gainHtml = (pct, usd) => {
    if (pct === null || isNaN(pct)) return `<span class="value">—</span>`;
    const cls = pct >= 0 ? "up" : "down";
    const sign = pct >= 0 ? "+" : "-";
    const inAvax = P ? Math.abs(usd) / P : null;
    return `<span class="value change ${cls}">${sign}${Math.abs(pct).toFixed(2)} %
      <small class="chg ${cls}">${sign}${fmtUsd(Math.abs(usd))}${inAvax !== null ? ` · ${sign}${fmtAvax(inAvax)}` : ""}</small></span>`;
  };

  let totAmount = 0, totCost = 0;
  const rows = loans.map((l, i) => {
    const cost = l.amount * l.price;
    totAmount += l.amount;
    totCost += cost;
    const pct = P ? (P - l.price) / l.price * 100 : null;
    const usd = P ? l.amount * (P - l.price) : null;
    return `
      <div class="row">
        <span class="label">${escHtml(l.label || "Emprunt " + (i + 1))}<br>
          <small>${fmtAvax(l.amount)} @ ${fmtUsd(l.price)} · dette ${fmtUsd(cost)}</small></span>
        ${gainHtml(pct, usd)}
      </div>`;
  }).join("");

  const avgPrice = totCost / totAmount;
  const totPct = P ? (P - avgPrice) / avgPrice * 100 : null;
  const totUsd = P ? totAmount * P - totCost : null;
  const totCls = totUsd === null ? "" : (totUsd >= 0 ? "up" : "down");
  const totSign = totUsd === null ? "" : (totUsd >= 0 ? "+" : "-");

  card.innerHTML = `
    <div class="name">Emprunt</div>
    <div class="account-total">${totPct !== null ? totSign + Math.abs(totPct).toFixed(2) + " %" : "—"}</div>
    ${totUsd !== null ? `<div class="account-chg chg ${totCls}">${totSign}${fmtUsd(Math.abs(totUsd))} · ${totSign}${fmtAvax(Math.abs(totUsd) / P)}</div>` : ""}
    <div class="account-usd">Prix AVAX actuel : ${fmtUsd(P)}</div>
    ${rows}
    <div class="row loan-total">
      <span class="label">Total — ${fmtAvax(totAmount)} @ ${fmtUsd(avgPrice)} (prix moyen)<br>
        <small>dette ${fmtUsd(totCost)} · valeur actuelle ${P ? fmtUsd(totAmount * P) : "—"}</small></span>
      ${gainHtml(totPct, totUsd)}
    </div>`;
}

async function refreshAll() {
  await Promise.all([...pairs.map((p, i) => fetchPair(p, i)), fetchAccount()]);
  applySort();
  renderSummary();
  renderLoans();
  checkStartupAlerts();
  document.getElementById("lastUpdate").textContent =
    "Dernière mise à jour : " + new Date().toLocaleTimeString("fr-FR");
}

/* =========================================================
   ALERTE AU DÉMARRAGE (mouvement de valeur position depuis
   la dernière consultation). Ne s'exécute qu'une seule fois
   par chargement de page, quel que soit le nombre de positions
   qui déclenchent l'alerte (une seule popup regroupée).
   ========================================================= */
function checkStartupAlerts() {
  if (startupCheckDone) return;
  startupCheckDone = true;

  const triggered = [];
  pairs.forEach((p, i) => {
    const m = metrics[i];
    if (!m || m.value === null || m.value === undefined || isNaN(m.value)) return;
    const key = p.chain + ":" + p.address;
    const prev = snapshots[key];
    if (typeof prev === "number" && prev > 0) {
      const changePct = ((m.value - prev) / prev) * 100;
      if (Math.abs(changePct) >= ALERT_THRESHOLD) {
        triggered.push({
          name: m.symbol || (p.chain + " " + p.address.slice(0, 6)),
          changePct,
          prevValue: prev,
          currentValue: m.value
        });
      }
    }
    snapshots[key] = m.value;
  });
  saveSnapshots(snapshots);

  if (triggered.length > 0) showAlertModal(triggered);
}

function showAlertModal(triggered) {
  triggered.sort((a, b) => b.changePct - a.changePct);
  const list = document.getElementById("alertList");
  list.innerHTML = triggered.map(t => {
    const cls = t.changePct >= 0 ? "up" : "down";
    const sign = t.changePct >= 0 ? "+" : "";
    return `
      <div class="row">
        <span class="label">${t.name}</span>
        <span class="value change ${cls}">${sign}${t.changePct.toFixed(1)}% (${fmtMcap(t.prevValue)} → ${fmtMcap(t.currentValue)})</span>
      </div>
    `;
  }).join("");
  document.getElementById("alertOverlay").style.display = "flex";
}

document.getElementById("alertOkBtn").addEventListener("click", () => {
  document.getElementById("alertOverlay").style.display = "none";
});

function renderSummary() {
  const summary = document.getElementById("summary");
  const values = Object.values(bagValues);
  if (values.some(v => v === null || v === undefined) || values.length < pairs.length) {
    summary.innerHTML = `<div class="skeleton">Calcul du portefeuille...</div>`;
    return;
  }
  const totalValue = values.reduce((a, b) => a + b, 0);
  const TOTAL_INVESTED = pairs.reduce((sum, p) => sum + p.invested, 0);
  const totalPnl = totalValue - TOTAL_INVESTED;
  const totalPnlPct = (totalPnl / TOTAL_INVESTED) * 100;
  const pnlClass = totalPnl >= 0 ? "up" : "down";
  const pnlSign = totalPnl >= 0 ? "+" : "";

  summary.innerHTML = `
    <div class="summary-title">Portefeuille total</div>
    <div class="row">
      <span class="label">Investi initial</span>
      <span class="value">${fmtMcap(TOTAL_INVESTED)}</span>
    </div>
    <div class="row">
      <span class="label">Valeur actuelle</span>
      <span class="value">${fmtMcap(totalValue)}</span>
    </div>
    <div class="row">
      <span class="label">PnL total</span>
      <span class="value change ${pnlClass}">${pnlSign}${fmtMcap(Math.abs(totalPnl))} (${pnlSign}${totalPnlPct.toFixed(1)}%)</span>
    </div>
  `;
}

refreshAll();
setInterval(refreshAll, 15000);
</script>
